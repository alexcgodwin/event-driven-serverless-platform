<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="1280" height="640" rx="28" fill="#07111F"/><rect x="42" y="42" width="1196" height="556" rx="24" fill="#0B1E34" stroke="#23577E"/><text x="76" y="96" fill="#FFFFFF" font-family="Segoe UI, Arial" font-size="34" font-weight="700">Event-Driven Serverless Platform</text><text x="76" y="126" fill="#8EA7BC" font-family="Segoe UI, Arial" font-size="16">Queue-first asynchronous workload pattern with retries, audit trail, storage output and dead-letter handling.</text><g font-family="Segoe UI, Arial"><rect x="70" y="210" width="190" height="88" rx="14" fill="#102A43" stroke="#2D6D99"/><text x="100" y="245" fill="#83D2FF" font-size="14" font-weight="700">Event Source</text><text x="100" y="272" fill="#D8E6F2" font-size="16">Request accepted</text><rect x="315" y="210" width="190" height="88" rx="14" fill="#102A43" stroke="#2D6D99"/><text x="345" y="245" fill="#83D2FF" font-size="14" font-weight="700">Queue</text><text x="345" y="272" fill="#D8E6F2" font-size="16">Buffer and retry</text><rect x="560" y="210" width="210" height="88" rx="14" fill="#102A43" stroke="#2D6D99"/><text x="590" y="245" fill="#83D2FF" font-size="14" font-weight="700">Function Processor</text><text x="590" y="272" fill="#D8E6F2" font-size="16">Business handler</text><rect x="840" y="150" width="190" height="88" rx="14" fill="#091827" stroke="#2D6D99"/><text x="870" y="185" fill="#83D2FF" font-size="14" font-weight="700">Storage</text><text x="870" y="212" fill="#D8E6F2" font-size="16">Processed output</text><rect x="840" y="280" width="190" height="88" rx="14" fill="#091827" stroke="#2D6D99"/><text x="870" y="315" fill="#83D2FF" font-size="14" font-weight="700">Audit Log</text><text x="870" y="342" fill="#D8E6F2" font-size="16">Trace and evidence</text><rect x="315" y="405" width="230" height="88" rx="14" fill="#2A1620" stroke="#A14C6A"/><text x="345" y="440" fill="#FF9FBA" font-size="14" font-weight="700">Dead Letter Queue</text><text x="345" y="467" fill="#FFDCE6" font-size="16">Failure inspection path</text><path d="M260 254H315M505 254H560M770 238L840 194M770 270L840 324M410 298V405" stroke="#75D5FF" stroke-width="3" marker-end="url(#arrow)"/><rect x="1050" y="210" width="150" height="88" rx="14" fill="#102A43" stroke="#2D6D99"/><text x="1075" y="245" fill="#83D2FF" font-size="14" font-weight="700">Evidence</text><text x="1075" y="272" fill="#D8E6F2" font-size="16">Validated flow</text><path d="M1030 194L1050 234M1030 324L1050 274" stroke="#75D5FF" stroke-width="3" marker-end="url(#arrow)"/><text x="76" y="555" fill="#607B91" font-size="15">Pattern is optimized for low-cost validation, burst protection, failure isolation and traceable processing.</text></g><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#75D5FF"/></marker></defs></svg>