name: Serverless Validation

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform format
        working-directory: terraform
        run: terraform fmt -check -recursive
      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend=false -input=false
      - name: Terraform validate
        working-directory: terraform
        run: terraform validate
      - name: Node syntax check
        run: node --check src/handler.js
      - name: Handler contract check
        run: |
          grep -q "processedCount" src/handler.js
          grep -q "receivedAt" src/handler.js
      - name: Handler unit tests
        run: node --test tests/handler.test.js
